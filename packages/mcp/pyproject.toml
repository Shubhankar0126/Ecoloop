[project]
name = "ecoloop-mcp"
version = "0.1.0"
description = "Framework-independent MCP tool platform for EcoLoop AI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ecoloop-common",
    "ecoloop-energyplus",
    "mcp>=1.28.1,<2.0.0",
    "pydantic>=2.11.7,<3.0.0",
]

[tool.uv.sources]
ecoloop-common = { workspace = true }
ecoloop-energyplus = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"
