[project]
name = "ecoloop-ai-agent"
version = "0.1.0"
description = "Framework-independent AI agent platform for EcoLoop AI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ecoloop-common",
    "ecoloop-energyplus",
    "ecoloop-mcp",
    "langchain-core>=1.5.1,<2.0.0",
    "langchain-ollama>=1.1.0,<2.0.0",
    "langgraph>=1.2.9,<2.0.0",
    "mcp>=1.28.1,<2.0.0",
    "pydantic>=2.11.7,<3.0.0",
]

[tool.uv.sources]
ecoloop-common = { workspace = true }
ecoloop-energyplus = { workspace = true }
ecoloop-mcp = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"
