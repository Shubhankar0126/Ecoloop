[project]
name = "ecoloop-energyplus"
version = "0.1.0"
description = "Framework-independent EnergyPlus platform models for EcoLoop AI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ecoloop-common",
    "pydantic>=2.11.7,<3.0.0",
]

[tool.uv.sources]
ecoloop-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"
