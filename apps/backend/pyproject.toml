[project]
name = "ecoloop-backend"
version = "0.1.0"
description = "EcoLoop AI v2 FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ecoloop-ai-agent",
    "ecoloop-common",
    "ecoloop-energyplus",
    "ecoloop-mcp",
    "fastapi>=0.116.1,<0.117.0",
    "pydantic-settings>=2.10.1,<3.0.0",
    "uvicorn[standard]>=0.35.0,<0.36.0",
]

[project.scripts]
ecoloop-backend = "ecoloop_backend.main:run"

[dependency-groups]
dev = [
    "httpx>=0.28.1,<0.29.0",
    "mypy>=1.18.2,<2.0.0",
    "pytest>=8.4.1,<9.0.0",
    "pytest-cov>=6.2.1,<7.0.0",
    "ruff>=0.12.7,<0.13.0",
]

[tool.uv.sources]
ecoloop-ai-agent = { workspace = true }
ecoloop-common = { workspace = true }
ecoloop-energyplus = { workspace = true }
ecoloop-mcp = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"
